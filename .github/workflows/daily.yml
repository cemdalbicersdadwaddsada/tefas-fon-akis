name: TEFAS Gunluk Fon Snapshot

on:
  schedule:
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Snapshot cek
        run: python fetch_snapshot.py

      - name: Commit and push
        run: |
          git config user.name "tefas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
